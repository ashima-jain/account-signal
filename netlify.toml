[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Functions declare their own /api/* routes via `export const config = { path }`,
# so no /api/* rewrite is needed. Function routes are matched before this
# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
